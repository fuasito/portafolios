<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard de entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--card:#ffffff;--ink:#14181c;--mut:#5f6b76;--line:#dde2e7;--soft:#f4f6f8;
--c1:#c2255c;--c2:#1971c2;--c3:#e67700;--c4:#343a40;--pos:#2b8a3e;--neg:#c92a2a;--neu:#7c8a97;--acc:#1971c2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0f1317;--card:#171c22;--ink:#e9edf1;--mut:#93a0ac;--line:#28313a;--soft:#1d242b;
--c1:#f06595;--c2:#4dabf7;--c3:#ffa94d;--c4:#ced4da;--pos:#69db7c;--neg:#ff8787;--neu:#8795a1;--acc:#4dabf7}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#171c22;--ink:#e9edf1;--mut:#93a0ac;--line:#28313a;--soft:#1d242b;
--c1:#f06595;--c2:#4dabf7;--c3:#ffa94d;--c4:#ced4da;--pos:#69db7c;--neg:#ff8787;--neu:#8795a1;--acc:#4dabf7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:34px;letter-spacing:.2px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
.gbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;border-bottom:1px solid var(--line)}
.gbar label,.ctl label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:3px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;margin-bottom:10px;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;font:inherit;font-weight:600;background:transparent;color:var(--mut);border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:22px;margin:0 0 8px;font-weight:600}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:10px}
select,input[type=search],input[type=date],button.b{font:inherit;font-size:14px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=date]{color-scheme:light dark}
button.b{cursor:pointer;font-weight:600}
button.b:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;border:1.5px solid var(--line);background:var(--soft);color:var(--mut);border-radius:20px;padding:5px 12px 5px 10px;display:inline-flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--col);opacity:.35}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--col);background:var(--card)}
.chip[aria-pressed="true"] i{opacity:1}
.hint{font-size:12.5px;color:var(--mut);margin:0 0 6px}
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;touch-action:pan-y;user-select:none}
.tip{position:absolute;display:none;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 10px;font-size:13px;z-index:5;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tip b{font-weight:600}
.tip .r{display:flex;align-items:center;gap:6px;margin-top:2px}
.tip .r i{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .v{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--mut)}
.kpi .d{font-size:13px;font-weight:600}
.tw{overflow-x:auto}
.tw.tall{max-height:460px;overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--mut);cursor:pointer;user-select:none;background:var(--soft);position:sticky;top:0}
th.n,td.n{text-align:right}
tbody tr:hover{background:var(--soft)}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;border:1px solid var(--line)}
.tag.p{color:var(--pos);border-color:var(--pos)}.tag.v{color:var(--neg);border-color:var(--neg)}.tag.e{color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);margin:8px 0 0}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
svg text{font-family:'Barlow',system-ui,sans-serif}
</style>
</head>

const GCOL=Object.fromEntries(GROUPS.map((g,i)=>[g,['#e03131','#1c7ed6','#f08c00','#2f9e44','#9c36b5','#0c8599','#d6336c','#5c940d','#7048e8','#868e96'][i]]));

function tipEl(h){let t=h.querySelector('.tip');if(!t){t=document.createElement('div');t.className='tip';h.appendChild(t)}return t}
function showTip(h,html,x,y){const t=tipEl(h);t.innerHTML=html;t.style.display='block';const w=t.offsetWidth,hh=t.offsetHeight;let l=x+14;if(l+w>h.clientWidth)l=x-w-14;if(l<0)l=0;t.style.left=l+'px';t.style.top=Math.max(0,Math.min(y-hh/2,h.clientHeight-hh))+'px'}
function hideTip(h){const t=h.querySelector('.tip');if(t)t.style.display='none'}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p}

/* ============ MODELO DE DATOS ============ */
const SES=D.ses.map((s,i)=>({id:i,t:s[0],end:s[1],title:s[2],desc:s[3],sets:[],byEx:new Map()}));
D.sets.forEach(r=>{const x={s:r[0],e:r[1],i:r[2],ty:r[3],w:r[4],r:r[5],rpe:r[6]};const S=SES[x.s];S.sets.push(x);let l=S.byEx.get(x.e);if(!l){l=[];S.byEx.set(x.e,l)}l.push(x)});
const BW=D.bw.slice().sort((a,b)=>a[0]-b[0]);
const EXN=D.ex;
const MAIN=new Set([EXN.findIndex(e=>e.o==='Bench Press (Barbell)'),EXN.findIndex(e=>e.o==='Squat (Barbell)'),EXN.findIndex(e=>e.o==='Deadlift (Barbell)')]);
const EXCOUNT=EXN.map((_,i)=>SES.filter(s=>s.byEx.has(i)).length);
const DMIN=Math.floor(Math.min(SES[0].t,BW[0][0])/DAY)*DAY;
const DMAX=Math.floor(Math.max(SES[SES.length-1].t,BW[BW.length-1][0])/DAY)*DAY;
function bwAt(t){if(t<=BW[0][0])return BW[0][1];for(let i=1;i<BW.length;i++){if(t<=BW[i][0]){const a=BW[i-1],b=BW[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0])}}return BW[BW.length-1][1]}

const G={from:DMIN,to:DMAX,dow:'all',type:'all'};
const dowOf=t=>(new Date(t).getUTCDay()+6)%7;
const dowOk=t=>G.dow==='all'||dowOf(t)===+G.dow;
const inR=t=>t>=G.from&&t<G.to+DAY;
const inS=s=>inR(s.t)&&dowOk(s.t);
// los calentamientos nunca se cuentan; además se aplica el filtro de tipo de serie
const useSet=x=>x.ty!==1&&(G.type==='all'||(G.type==='normal'?x.ty===0:G.type==='failure'?x.ty===2:x.ty===3));
const capFor=(e,c)=>c==='auto'?(MAIN.has(e)?6:99):+c;

function bucket(t,g){
  if(g==='ses')return{key:t,t:t,t2:t+DAY*.8};
  const d=new Date(t);
  if(g==='week'){const day=(d.getUTCDay()+6)%7;const s=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day);return{key:s,t:s,t2:s+7*DAY}}
  const s=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);return{key:s,t:s,t2:Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)};
}
function blabel(b,g){if(g==='ses')return fmtD(b.t,1);if(g==='week')return 'Semana del '+fmtD(b.t,1);const d=new Date(b.t);return MES[d.getUTCMonth()]+' '+d.getUTCFullYear()}

const M={
  e1:{l:'e1RM estimado (kg)',f:v=>dec(v)+' kg',t:v=>dec(v,0)},
  rel:{l:'e1RM ÷ peso corporal (×)',f:v=>dec(v,2)+' ×',t:v=>dec(v,1)},
  mw:{l:'Peso máximo (kg)',f:v=>dec(v)+' kg',t:v=>dec(v,0)},
  vol:{l:'Volumen (kg·rep)',f:v=>nf(v)+' kg·rep',t:v=>v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.',',')+'k':String(Math.round(v))},
  sets:{l:'Series',f:v=>nf(v),t:v=>dec(v,0)},
  reps:{l:'Repeticiones',f:v=>nf(v),t:v=>dec(v,0)},
  rpe:{l:'RPE medio',f:v=>dec(v,1),t:v=>dec(v,1)},
  bs:{l:'Mejor serie (kg × reps)',f:v=>nf(v)+' kg·rep',t:v=>dec(v,0)}
};

function exPts(e,g,metric,cap){
  const bk=new Map();
  for(const s of SES){
    if(!inS(s))continue;const L=s.byEx.get(e);if(!L)continue;
    const b=bucket(s.t,g);let a=bk.get(b.key);
    if(!a){a={b,vol:0,sets:0,reps:0,rs:0,rn:0,e1:null,best:'',mw:null,rel:null,bs:null,bst:''};bk.set(b.key,a)}
    for(const x of L){
      if(useSet(x)){a.sets++;a.reps+=x.r;if(x.w!=null)a.vol+=x.w*x.r}
      if(useSet(x)){
        if(x.rpe!=null){a.rs+=x.rpe;a.rn++}
        if(x.w!=null){
          if(a.mw==null||x.w>a.mw)a.mw=x.w;
          const pv=x.w*x.r;if(a.bs==null||pv>a.bs){a.bs=pv;a.bst=dec(x.w,1)+' kg × '+x.r}
          if(x.r>0&&x.r<=cap){const e1=x.w*(1+x.r/30);
            if(a.e1==null||e1>a.e1){a.e1=e1;a.best=dec(x.w,1)+' kg × '+x.r+(x.rpe!=null?' @'+dec(x.rpe,1):'')}
            const rel=e1/bwAt(s.t);if(a.rel==null||rel>a.rel)a.rel=rel}
        }
      }
    }
  }
  const pts=[];
  for(const a of [...bk.values()].sort((p,q)=>p.b.t-q.b.t)){
    const v={e1:a.e1,rel:a.rel,bs:a.bs,mw:a.mw,vol:a.vol,sets:a.sets,reps:a.reps,rpe:a.rn?a.rs/a.rn:null}[metric];
    if(v==null||((metric==='vol'||metric==='sets'||metric==='reps')&&a.sets===0))continue;
    pts.push({x:g==='ses'?a.b.t:(a.b.t+a.b.t2)/2,x1:a.b.t,x2:a.b.t2,v,label:blabel(a.b,g),extra:metric==='e1'&&a.best?'<div>Mejor serie: '+a.best+'</div>':(metric==='bs'&&a.bst?'<div>Serie: '+a.bst+'</div>':'')});
  }
  return pts;
}

/* ============ GRÁFICA CON EJE TEMPORAL ============ */
function tticks(d0,d1,X,minPx){
  const span=(d1-d0)/DAY,out=[];
  if(span>120){const d=new Date(d0);let y=d.getUTCFullYear(),mo=d.getUTCMonth(),t=Date.UTC(y,mo,1);if(t<d0){mo++;t=Date.UTC(y,mo,1)}
    while(t<=d1){const dd=new Date(t);out.push({t,l:MES[dd.getUTCMonth()]+' '+String(dd.getUTCFullYear()).slice(2)});mo++;t=Date.UTC(y,mo,1)}}
  else if(span>21){const d=new Date(d0);let t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-((d.getUTCDay()+6)%7));if(t<d0)t+=7*DAY;for(;t<=d1;t+=7*DAY)out.push({t,l:fmtD(t)})}
  else{for(let t=Math.ceil(d0/DAY)*DAY;t<=d1;t+=DAY)out.push({t,l:fmtD(t)})}
  const keep=[];let last=-1e9;out.forEach(k=>{const x=X(k.t);if(x-last>=minPx){keep.push(k);last=x}});return keep;
}
function tchart(host,o){
  host.innerHTML='';
  const W=host.clientWidth||600,H=o.h||340,m={l:o.ml||54,r:16,t:14,b:34},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const d0=o.d0,d1=o.d1,X=t=>m.l+(t-d0)/(d1-d0)*iw;
  const bars=o.kind!=='line';
  const ser=o.series.map(s=>({...s,pts:s.pts.filter(p=>bars?(p.x2>d0&&p.x1<d1):(p.x>=d0&&p.x<=d1))}));
  let lo,hi;
  if(o.kind==='stack'){const tot=new Map();ser.forEach(s=>s.pts.forEach(p=>tot.set(p.x1,(tot.get(p.x1)||0)+p.v)));const t=[...tot.values()];if(!t.length){host.innerHTML='<div class="empty">Sin datos en este periodo.</div>';return}lo=0;hi=Math.max(...t)}
  else{const vals=ser.flatMap(s=>s.pts.map(p=>p.v));if(o.hline)vals.push(o.hline.v);if(!vals.length){host.innerHTML='<div class="empty">Sin datos para esta selección y periodo.</div>';return}
    lo=Math.min(...vals);hi=Math.max(...vals);if(bars)lo=Math.min(0,lo)}
  if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*.08;if(!bars||lo<0)lo-=pad;hi+=pad;
  const step=niceStep((hi-lo)/5),t0=Math.ceil(lo/step)*step,ticks=[];
  for(let v=t0;v<=hi+1e-9;v+=step)ticks.push(+v.toFixed(6));
  const y=v=>m.t+(hi-v)/(hi-lo)*ih;
  const cid='cp-'+(host.id||'c');
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Gráfica')}"><defs><clipPath id="${cid}"><rect x="${m.l}" y="${m.t-4}" width="${iw}" height="${ih+8}"/></clipPath></defs>`;
  ticks.forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="12" style="fill:var(--mut)">${o.tick(v)}</text>`});
  if(lo<0&&hi>0)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--mut)"/>`;
  tticks(d0,d1,X,56).forEach(k=>{s+=`<line x1="${X(k.t)}" x2="${X(k.t)}" y1="${m.t+ih}" y2="${m.t+ih+4}" style="stroke:var(--mut)"/><text x="${X(k.t)}" y="${H-10}" text-anchor="middle" font-size="12" style="fill:var(--mut)">${k.l}</text>`});
  if(o.yTitle)s+=`<text x="4" y="10" font-size="11.5" style="fill:var(--mut)">${o.yTitle}</text>`;
  s+=`<g clip-path="url(#${cid})">`;
  if(o.kind==='stack'){
    const acc=new Map();
    ser.forEach(se=>se.pts.forEach(p=>{const base=acc.get(p.x1)||0;const wpx=Math.max(1.5,(X(p.x2)-X(p.x1))*.84);const cx=X((p.x1+p.x2)/2)-wpx/2;
      s+=`<rect x="${cx}" y="${y(base+p.v)}" width="${wpx}" height="${Math.max(0,y(base)-y(base+p.v))}" style="fill:${se.color}"/>`;acc.set(p.x1,base+p.v)}));
  }else if(o.kind==='bar'){
    const k=ser.length;
    ser.forEach((se,j)=>se.pts.forEach(p=>{const full=(X(p.x2)-X(p.x1))*.84,bw=Math.max(1.5,full/k);const cx=X((p.x1+p.x2)/2)-full/2+bw*j;
      s+=`<rect x="${cx}" y="${Math.min(y(p.v),y(0))}" width="${Math.max(1,bw-1)}" height="${Math.max(1,Math.abs(y(p.v)-y(0)))}" rx="1.5" style="fill:${se.color}"/>`}));
  }else{
    ser.forEach(se=>{const pts=se.pts.map(p=>[X(p.x),y(p.v)]);
      if(pts.length>1)s+=`<path d="M${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')}" fill="none" stroke-width="${se.thin?1.5:2.5}" stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 4"':''} style="stroke:${se.color}"/>`;
      if(!se.nodots)pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${pts.length>60?2.5:3.5}" style="fill:${se.color}"/>`)});
  }
  s+=`</g>`;
  if(o.hline)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(o.hline.v)}" y2="${y(o.hline.v)}" stroke-dasharray="5 4" style="stroke:var(--mut)"/><text x="${W-m.r-2}" y="${y(o.hline.v)-5}" text-anchor="end" font-size="12" style="fill:var(--mut)">${o.hline.label}</text>`;
  s+=`<g id="hv"></g><rect id="brush" y="${m.t}" height="${ih}" style="display:none;fill:var(--acc);opacity:.18"/><rect id="ov" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/></svg>`;
  host.innerHTML=s;
  const svg=host.querySelector('svg'),ov=host.querySelector('#ov'),brush=host.querySelector('#brush'),hv=host.querySelector('#hv');
  const px=e=>e.clientX-svg.getBoundingClientRect().left;
  const tAt=x=>d0+(x-m.l)/iw*(d1-d0);
  const hover=(x,e)=>{
    const all=[];ser.forEach((se,si)=>se.pts.forEach(p=>all.push({p,si,cx:bars?X((p.x1+p.x2)/2):X(p.x)})));
    if(!all.length)return;
    let ref=all[0];all.forEach(a=>{if(Math.abs(a.cx-x)<Math.abs(ref.cx-x))ref=a});
    const rows=[];let g='',tot=0;
    if(bars){
      ser.forEach(se=>{const p=se.pts.find(q=>q.x1===ref.p.x1);if(p){rows.push({se,p});tot+=p.v}});
      const wpx=(X(ref.p.x2)-X(ref.p.x1));g=`<rect x="${ref.cx-wpx/2}" y="${m.t}" width="${wpx}" height="${ih}" style="fill:var(--ink);opacity:.07"/>`;
    }else{
      g=`<line x1="${ref.cx}" x2="${ref.cx}" y1="${m.t}" y2="${m.t+ih}" style="stroke:var(--mut)" stroke-dasharray="3 3"/>`;
      ser.forEach(se=>{let best=null;se.pts.forEach(p=>{if(!best||Math.abs(X(p.x)-ref.cx)<Math.abs(X(best.x)-ref.cx))best=p});
        if(best&&Math.abs(X(best.x)-ref.cx)<=34){rows.push({se,p:best});g+=`<circle cx="${X(best.x)}" cy="${y(best.v)}" r="6" style="fill:none;stroke:${se.color};stroke-width:2"/>`}});
    }
    hv.innerHTML=g;
    let h=`<b>${ref.p.label}</b>`;
    rows.sort((a,b)=>o.kind==='stack'?b.p.v-a.p.v:0).forEach(({se,p})=>{h+=`<div class="r"><i style="background:${se.color}"></i>${esc(se.name)}: <b>${o.fmt(p.v)}</b>${!bars&&p.label!==ref.p.label?' · '+p.label:''}</div>${p.extra||''}`});
    if(o.kind==='stack'&&rows.length>1)h+=`<div class="r" style="margin-top:4px">Total: <b>${o.fmt(tot)}</b></div>`;
    showTip(host,h,ref.cx,e.clientY-host.getBoundingClientRect().top);
  };
  let drag=null;
  ov.addEventListener('pointerdown',e=>{drag={x:px(e),moved:false};ov.setPointerCapture(e.pointerId)});
  ov.addEventListener('pointermove',e=>{const x=px(e);
    if(drag){if(Math.abs(x-drag.x)>6)drag.moved=true;
      if(drag.moved&&o.onRange){brush.setAttribute('x',Math.min(x,drag.x));brush.setAttribute('width',Math.abs(x-drag.x));brush.style.display='block';hideTip(host);hv.innerHTML='';return}}
    hover(x,e)});
  ov.addEventListener('pointerup',e=>{
    if(drag&&drag.moved&&o.onRange){const x=px(e);const a=tAt(Math.min(x,drag.x)),b=tAt(Math.max(x,drag.x));drag=null;o.onRange(a,b);return}
    drag=null});
  ov.addEventListener('pointerleave',e=>{if(!drag&&e.pointerType!=='touch'){hideTip(host);hv.innerHTML=''}});
  ov.addEventListener('dblclick',()=>o.onRange&&o.onRange(null));
}
const zoomTo=(a,b)=>{if(a==null){setRange(DMIN,DMAX);return}let f=Math.floor(a/DAY)*DAY,t=Math.floor(b/DAY)*DAY;if(t-f<2*DAY)t=f+2*DAY;setRange(f,t)};
const baseOpts=()=>({d0:G.from,d1:G.to+DAY,onRange:zoomTo});

/* ============ BARRAS HORIZONTALES ============ */
function hbar(host,items,o){
  host.innerHTML='';
  if(!items.length){host.innerHTML='<div class="empty">Ningún dato coincide con el filtro.</div>';return}
  const W=host.clientWidth||600,rh=28,m={l:Math.min(230,W*.46),r:62,t:6,b:24},H=m.t+m.b+items.length*rh;
  const vals=items.map(i=>i.value);let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(lo===hi)hi=1;
  const iw=W-m.l-m.r,x=v=>m.l+(v-lo)/(hi-lo)*iw,z=x(0),step=niceStep((hi-lo)/4);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Barras')}">`;
  for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" style="stroke:var(--line)"/><text x="${x(v)}" y="${H-8}" text-anchor="middle" font-size="12" style="fill:var(--mut)">${o.tick(v)}</text>`;
  const maxc=Math.floor((m.l-10)/6.4);
  items.forEach((it,i)=>{const yy=m.t+i*rh,x1=x(it.value),bx=Math.min(z,x1),bw=Math.max(1,Math.abs(x1-z));
    const nm=it.name.length>maxc?it.name.slice(0,maxc-1)+'…':it.name;
    s+=`<text x="${m.l-8}" y="${yy+rh/2+4}" text-anchor="end" font-size="13" style="fill:var(--ink)">${esc(nm)}</text><rect x="${bx}" y="${yy+4}" width="${bw}" height="${rh-8}" rx="2" style="fill:${it.color}"/>`;
    s+=it.value>=0?`<text x="${x1+5}" y="${yy+rh/2+4}" font-size="12.5" font-weight="600" style="fill:var(--ink)">${o.fmt(it.value)}</text>`:`<text x="${x1-5}" y="${yy+rh/2+4}" text-anchor="end" font-size="12.5" font-weight="600" style="fill:var(--ink)">${o.fmt(it.value)}</text>`;
    s+=`<rect class="row" data-i="${i}" x="0" y="${yy}" width="${W}" height="${rh}" fill="transparent"/>`});
  s+=`<line x1="${z}" x2="${z}" y1="${m.t}" y2="${H-m.b}" style="stroke:var(--mut)"/></svg>`;
  host.innerHTML=s;
  host.querySelectorAll('.row').forEach(r=>{const go=e=>{const it=items[+r.dataset.i];const bb=host.getBoundingClientRect();showTip(host,`<b>${esc(it.name)}</b><div>${o.fmt(it.value)}</div>${it.extra||''}`,e.clientX-bb.left,e.clientY-bb.top)};
    r.addEventListener('pointermove',go);r.addEventListener('pointerdown',go);r.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hideTip(host)})});
}

/* ============ TABLAS ORDENABLES ============ */
function sortable(host,cols,rows,st,cb,tall){
  const r=[...rows].sort((p,q)=>{const A=p[st.key],B=q[st.key];if(A==null&&B==null)return 0;if(A==null)return 1;if(B==null)return -1;return(typeof A==='string'?A.localeCompare(B,'es'):A-B)*st.dir});
  host.innerHTML=`<div class="tw${tall?' tall':''}"><table><thead><tr>`+cols.map(c=>`<th data-k="${c.key}" class="${c.num?'n':''}" title="Ordenar">${c.label}${st.key===c.key?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
   r.map(x=>'<tr>'+cols.map(c=>`<td class="${c.num?'n':''} ${c.cls?c.cls(x[c.key],x):''}">${c.f?c.f(x[c.key],x):esc(x[c.key])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
  host.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(typeof (rows[0]||{})[k]==='string')?1:-1}cb()});
}

/* ============ ESTADO GLOBAL Y FILTROS ============ */
let redraw=()=>{};
function setRange(f,t){
  G.from=Math.max(DMIN,Math.min(f,DMAX-DAY));G.to=Math.min(DMAX,Math.max(t,G.from+DAY));
  syncG(true);redraw();
}
function syncG(custom){
  $('#gfrom').value=toISO(G.from);$('#gto').value=toISO(G.to);
  if(custom){const full=G.from===DMIN&&G.to===DMAX;if(full)$('#preset').value='all';else{const p=$('#preset');if(!p.dataset.keep)p.value='custom'}}
}
function initGlobal(){
  $('#gfrom').min=$('#gto').min=toISO(DMIN);$('#gfrom').max=$('#gto').max=toISO(DMAX);
  $('#gfrom').onchange=e=>{if(e.target.value){delete $('#preset').dataset.keep;setRange(fromISO(e.target.value),G.to)}};
  $('#gto').onchange=e=>{if(e.target.value){delete $('#preset').dataset.keep;setRange(G.from,fromISO(e.target.value))}};
  $('#gdow').onchange=e=>{G.dow=e.target.value;redraw()};
  $('#gtype').onchange=e=>{G.type=e.target.value;redraw()};
  $('#greset').onclick=()=>{$('#preset').value='all';setRange(DMIN,DMAX)};
  $('#preset').onchange=e=>{const v=e.target.value,P=$('#preset');
    const days={'6m':182,'12w':84,'8w':56,'4w':28}[v];
    P.dataset.keep='1';
    if(v==='all')setRange(DMIN,DMAX);else if(days)setRange(DMAX-days*DAY,DMAX);
    delete P.dataset.keep};
  syncG(false);
}

const S={tab:'res',

const TABS=[['res','Resumen'],['str','Fuerza'],['rec','Récords'],['bw','Peso corporal'],['vol','Volumen'],['ex','Ejercicios'],['int','Intensidad'],['cmp','Comparar'],['hab','Hábitos'],['ses','Sesiones']];

function sessionStats(s){let sets=0,vol=0,rs=0,rn=0;for(const x of s.sets){if(useSet(x)){sets++;if(x.w!=null)vol+=x.w*x.r}if(useSet(x)&&x.rpe!=null){rs+=x.rpe;rn++}}
  return{sets,vol,rpe:rn?rs/rn:null,dur:(s.end-s.t)/6e4,nex:s.byEx.size}}
const sesInR=()=>SES.filter(s=>inS(s));
const bwInR=()=>BW.filter(b=>inR(b[0]));

/* ---- Resumen ---- */
function tabRes(){
  $('#view').innerHTML=`<div class="kpis" id="k"></div>
  <div class="two"><div class="panel"><h2>Peso corporal</h2><div id="cW" class="chart"></div></div>
  <div class="panel"><h2>Series por semana</h2><div id="cV" class="chart"></div></div></div>
  <div class="panel"><h2>Reparto de series por grupo muscular</h2><div id="cG" class="chart"></div>
  <p class="note">Cada ejercicio se asigna a un único grupo (sentadilla → cuádriceps, peso muerto → femoral/glúteo, face pull → hombros). Es una clasificación mía, aproximada.</p></div>`;
  redraw=()=>{
    const ss=sesInR(),st=ss.map(sessionStats);
    const sets=st.reduce((a,b)=>a+b.sets,0),vol=st.reduce((a,b)=>a+b.vol,0);
    const days=new Set(ss.map(s=>Math.floor(s.t/DAY))).size;
    const weeks=(G.to+DAY-G.from)/(7*DAY);
    const durs=st.map(x=>x.dur).filter(d=>d>0&&d<400);
    let rs=0,rn=0;ss.forEach(s=>s.sets.forEach(x=>{if(useSet(x)&&x.rpe!=null){rs+=x.rpe;rn++}}));
    const bw=bwInR();
    const dW=bw.length>1?bw[bw.length-1][1]-bw[0][1]:null;
    $('#k').innerHTML=`<div class="kpi"><div class="v">${ss.length}</div><div class="l">Sesiones (${days} días distintos)</div><div class="d">${dec(ss.length/weeks,1)} por semana</div></div>
     <div class="kpi"><div class="v">${nf(sets)}</div><div class="l">Series</div></div>
     <div class="kpi"><div class="v">${nf(vol)}</div><div class="l">Volumen total (kg·rep)</div><div class="d">${nf(vol/weeks)} por semana</div></div>
     <div class="kpi"><div class="v">${durs.length?nf(durs.reduce((a,b)=>a+b,0)/durs.length):'—'} min</div><div class="l">Duración media por sesión</div></div>
     <div class="kpi"><div class="v">${rn?dec(rs/rn,1):'—'}</div><div class="l">RPE medio</div></div>
     <div class="kpi"><div class="v">${bw.length?dec(bw[bw.length-1][1]):'—'} kg</div><div class="l">Peso al final del periodo</div><div class="d ${cls(dW)}">${dW==null?'':sg(dW)+' kg en el periodo'}</div></div>`;
    tchart($('#cW'),{...baseOpts(),kind:'line',h:260,series:[{name:'Peso',color:'var(--c2)',pts:BW.map(b=>({x:b[0],v:b[1],label:fmtD(b[0],1)}))}],fmt:v=>dec(v)+' kg',tick:v=>dec(v,0),aria:'Peso corporal'});
    tchart($('#cV'),{...baseOpts(),kind:'bar',h:260,series:[{name:'Series',color:'var(--c1)',pts:volPts('week','sets')}],fmt:v=>nf(v),tick:v=>dec(v,0),aria:'Series por semana'});

/* ---- Volumen ---- */
function volPts(g,metric,group){
  const bk=new Map();
  for(const s of SES){if(!inS(s))continue;const b=bucket(s.t,g);let a=bk.get(b.key);if(!a){a={b,sets:0,vol:0,reps:0,ses:new Set()};bk.set(b.key,a)}
    let any=false;
    for(const x of s.sets){if(!useSet(x))continue;if(group&&EXN[x.e].g!==group)continue;any=true;a.sets++;a.reps+=x.r;if(x.w!=null)a.vol+=x.w*x.r}
    if(any)a.ses.add(s.id)}
  return [...bk.values()].sort((p,q)=>p.b.t-q.b.t).map(a=>({x:(a.b.t+a.b.t2)/2,x1:a.b.t,x2:a.b.t2,v:metric==='sessions'?a.ses.size:a[metric],label:blabel(a.b,g)}));
}
const VM={sets:{l:'Series',f:v=>nf(v)},vol:{l:'Volumen (kg·rep)',f:v=>nf(v)+' kg·rep'},reps:{l:'Repeticiones',f:v=>nf(v)},sessions:{l:'Sesiones',f:v=>nf(v)}};

    <label>Agrupar por<select id="gran"><option value="week">Semana</option><option value="month">Mes</option></select></label>
    <label>Desglose<select id="mode"><option value="total">Total</option><option value="group">Por grupo muscular</option></select></label>
    <label id="avgl" style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" id="avg"> Media del periodo</label></div>
   <div class="ctl" id="gc"><div class="chips" id="chips"></div></div>

   <div id="ch" class="chart"></div><div class="kpis" id="k" style="margin-top:12px"></div>
   <p class="note">Volumen = peso × repeticiones (las series sin peso, como la rueda abdominal, cuentan como series y repeticiones pero no suman volumen). No refleja directamente el estímulo muscular.</p></div>`;
  $('#metric').value=st.metric;$('#gran').value=st.gran;$('#mode').value=st.mode;$('#avg').checked=st.avg;
  $('#chips').innerHTML=GROUPS.map(g=>`<button class="chip" data-g="${g}" style="--col:${GCOL[g]}" aria-pressed="${st.groups.has(g)}"><i></i>${g}</button>`).join('');
  const draw=()=>{
    const grp=st.mode==='group';$('#gc').style.display=grp?'flex':'none';$('#avgl').style.display=grp?'none':'flex';
    const f=VM[st.metric].f;

    else series=[{name:VM[st.metric].l,color:'var(--c2)',pts:volPts(st.gran,st.metric)}];
    const tp=volPts(st.gran,st.metric),vis=tp.filter(p=>p.x2>G.from&&p.x1<G.to+DAY);

    tchart($('#ch'),{...baseOpts(),kind:grp?'stack':'bar',series,fmt:f,tick:v=>M.vol.t(v),hline:st.avg&&!grp&&vis.length?{v:avg,label:'media '+nf(avg)}:null,aria:'Volumen',h:360});
    if(vis.length){const mx=vis.reduce((a,p)=>p.v>a.v?p:a),mn=vis.reduce((a,p)=>p.v<a.v?p:a);const unit=st.gran==='week'?'semana':'mes';
      $('#k').innerHTML=`<div class="kpi"><div class="v">${nf(vis.reduce((a,p)=>a+p.v,0))}</div><div class="l">Total del periodo</div></div><div class="kpi"><div class="v">${nf(avg)}</div><div class="l">Media por ${unit} (con entrenamiento)</div></div><div class="kpi"><div class="v">${nf(mx.v)}</div><div class="l">Máximo: ${mx.label}</div></div><div class="kpi"><div class="v">${nf(mn.v)}</div><div class="l">Mínimo: ${mn.label}</div></div>`}

/* ---- Ejercicios ---- */
function exRows(){
  const mid=(G.from+G.to+DAY)/2,rows=[];
  EXN.forEach((ex,e)=>{
    let ses=0,sets=0,reps=0,vol=0,a=null,b=null,best=null;const cap=capFor(e,'auto');
    for(const s of SES){if(!inS(s))continue;const L=s.byEx.get(e);if(!L)continue;ses++;
      for(const x of L){if(useSet(x)){sets++;reps+=x.r;if(x.w!=null)vol+=x.w*x.r}
        if(useSet(x)&&x.w!=null&&x.r>0&&x.r<=cap){const e1=x.w*(1+x.r/30);if(best==null||e1>best)best=e1;if(s.t<mid){if(a==null||e1>a)a=e1}else{if(b==null||e1>b)b=e1}}}}
    if(!ses)return;
    const chg=a!=null&&b!=null?(b/a-1)*100:null;
    rows.push({e,n:ex.n,g:ex.g,ses,sets,reps,vol,best,a,b,chg,st:chg==null?'—':chg>3?'Sube':chg<-3?'Baja':'Estable'});
  });
  return rows;
}

/* ============ UTILIDADES NUEVAS ============ */
const DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const grpOpts=main=>'<option value="all">Todos los grupos</option>'+(main?'<option value="__main">Solo básicos (S/B/D)</option>':'')+GROUPS.map(g=>`<option value="${g}">${g}</option>`).join('');
const grpOk=(e,g)=>g==='all'||(g==='__main'?MAIN.has(e):EXN[e].g===g);
const pct=(b,a)=>a&&b!=null&&a!==0?(b/a-1)*100:null;
const dayStart=t=>Math.floor(t/DAY)*DAY;
function bestE1(e){
  const cap=capFor(e,'auto');let b=null;
  for(const s of SES){if(s.t>=G.to+DAY)break;const L=s.byEx.get(e);if(!L)continue;
    for(const x of L){if(x.ty!==1&&x.w!=null&&x.r>0&&x.r<=cap){const v=x.w*(1+x.r/30);if(b==null||v>b)b=v}}}
  return b;
}
function prSeries(e,metric,cap){
  const out=[];let max=null;
  for(const s of SES){
    if(s.t>=G.to+DAY)break;const L=s.byEx.get(e);if(!L)continue;
    let v=null,txt='';
    for(const x of L){if(!useSet(x)||x.w==null||x.r<=0)continue;
      const c=metric==='e1'?(x.r<=cap?x.w*(1+x.r/30):null):x.w;
      if(c!=null&&(v==null||c>v)){v=c;txt=dec(x.w,1)+' kg × '+x.r+(x.rpe!=null?' @'+dec(x.rpe,1):'')}}
    if(v==null)continue;
    const pr=max!=null&&v>max+1e-9;
    out.push({t:s.t,v,txt,pr,prev:max});
    if(max==null||v>max)max=v;
  }
  return out;
}

/* ---- mapa de calor ---- */
function heat(host,grid,hours,fmt){
  host.innerHTML='';
  const W=host.clientWidth||600,left=40,top=22,ch=32,cw=(W-left-6)/hours.length,H=top+ch*7+4;
  let max=0;grid.forEach(r=>r.forEach(v=>{if(v>max)max=v}));
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de calor semanal">`;
  hours.forEach((h,j)=>{s+=`<text x="${left+cw*j+cw/2}" y="14" text-anchor="middle" font-size="11.5" style="fill:var(--mut)">${h}h</text>`});
  grid.forEach((r,i)=>{
    s+=`<text x="${left-8}" y="${top+ch*i+ch/2+4}" text-anchor="end" font-size="12.5" style="fill:var(--mut)">${DOW[i]}</text>`;
    r.forEach((v,j)=>{
      const op=v>0?.14+.86*v/max:1;
      s+=`<rect class="cell" data-i="${i}" data-j="${j}" x="${left+cw*j+1}" y="${top+ch*i+1}" width="${cw-2}" height="${ch-2}" rx="3" style="fill:${v>0?'var(--acc)':'var(--soft)'};opacity:${op}"/>`;
      if(v>0&&cw>30)s+=`<text x="${left+cw*j+cw/2}" y="${top+ch*i+ch/2+4}" text-anchor="middle" font-size="11.5" style="fill:${op>.55?'#fff':'var(--ink)'};pointer-events:none">${fmt.short(v)}</text>`;
    });
  });
  s+='</svg>';host.innerHTML=s;
  host.querySelectorAll('.cell').forEach(c=>{
    const go=e=>{const i=+c.dataset.i,j=+c.dataset.j,bb=host.getBoundingClientRect();showTip(host,`<b>${DOW[i]} · ${hours[j]}:00</b><div>${fmt.long(grid[i][j])}</div>`,e.clientX-bb.left,e.clientY-bb.top)};
    c.addEventListener('pointermove',go);c.addEventListener('pointerdown',go);
    c.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hideTip(host)});
  });
}

/* ============ INTENSIDAD Y FATIGA ============ */
const RPEB=[['≤ 7,5',v=>v<=7.5],['8',v=>v===8],['8,5',v=>v===8.5],['9',v=>v===9],['9,5',v=>v===9.5],['10',v=>v>=10]];
const PCTB=[['< 60 %',v=>v<60],['60–70 %',v=>v<70],['70–80 %',v=>v<80],['80–90 %',v=>v<90],['≥ 90 %',v=>true]];
const RAMP=['#74c0fc','#4dabf7','#fab005','#fd7e14','#e03131','#a61e4d'];
function distPts(dist,grp,gran,norm){
  const B=dist==='rpe'?RPEB:PCTB,best=dist==='pct'?EXN.map((_,e)=>bestE1(e)):null;
  const cols=dist==='rpe'?RAMP:RAMP.slice(1),bk=new Map();
  for(const s of SES){
    if(!inS(s))continue;const b=bucket(s.t,gran);let a=bk.get(b.key);if(!a){a={b,c:B.map(()=>0)};bk.set(b.key,a)}
    for(const x of s.sets){
      if(!useSet(x)||!grpOk(x.e,grp))continue;
      let v;if(dist==='rpe'){if(x.rpe==null)continue;v=x.rpe}else{if(x.w==null||best[x.e]==null)continue;v=x.w/best[x.e]*100}
      a.c[B.findIndex(q=>q[1](v))]++;
    }
  }
  const rows=[...bk.values()].sort((p,q)=>p.b.t-q.b.t);
  return B.map((q,i)=>({name:q[0],color:cols[i],pts:rows.map(a=>{const tot=a.c.reduce((x,y)=>x+y,0);return{x:(a.b.t+a.b.t2)/2,x1:a.b.t,x2:a.b.t2,v:norm?(tot?a.c[i]/tot*100:0):a.c[i],label:blabel(a.b,gran)}}).filter(p=>p.v>0)}));
}
function dropRows(grp,min){
  const m=new Map();
  for(const s of SES){if(!inS(s))continue;
    for(const [e,L] of s.byEx){if(!grpOk(e,grp))continue;
      const W=L.filter(x=>useSet(x)&&x.w!=null&&x.r>0).sort((p,q)=>p.i-q.i);
      if(W.length<2)continue;const [a,b,c]=W;
      if(Math.abs(b.w-a.w)/a.w>.03)continue;
      let o=m.get(e);if(!o){o={n:0,r1:0,r2:0,n3:0,q1:0,q3:0};m.set(e,o)}
      o.n++;o.r1+=a.r;o.r2+=b.r;
      if(c&&Math.abs(c.w-a.w)/a.w<=.03){o.n3++;o.q1+=a.r;o.q3+=c.r}
    }}
  return [...m.entries()].filter(([e,o])=>o.n>=min).map(([e,o])=>({n:EXN[e].n,g:EXN[e].g,ses:o.n,r1:o.r1/o.n,r2:o.r2/o.n,drop:(o.r2/o.r1-1)*100,ses3:o.n3,drop3:o.n3?(o.q3/o.q1-1)*100:null}));
}

    const B=st.dist==='rpe'?RPEB:PCTB,cols=st.dist==='rpe'?RAMP:RAMP.slice(1);
    $('#leg').innerHTML=B.map((q,i)=>`<span><i style="background:${cols[i]}"></i>${q[0]}</span>`).join('');
    const ser=distPts(st.dist,st.grp,st.gran,st.norm);
    tchart($('#ch'),{...baseOpts(),kind:'stack',h:320,series:ser,fmt:st.norm?v=>dec(v,1)+' %':v=>nf(v)+' series',tick:st.norm?v=>dec(v,0)+'%':v=>dec(v,0),aria:'Distribución de intensidad'});
    const raw=distPts(st.dist,st.grp,st.gran,false),vis=raw.map(s=>({name:s.name,color:s.color,n:s.pts.filter(p=>p.x2>G.from&&p.x1<G.to+DAY).reduce((a,p)=>a+p.v,0)}));
    const tot=vis.reduce((a,b)=>a+b.n,0);
    hbar($('#ov'),vis.map(v=>({name:v.name,value:v.n,color:v.color,extra:`<div>${tot?dec(v.n/tot*100,1):0} % del total</div>`})),{fmt:v=>nf(v),tick:v=>dec(v,0),aria:'Reparto total'});
    let n=0,rn=0,rs=0,hi=0,ten=0,wn=0;
    for(const s of SES){if(!inS(s))continue;for(const x of s.sets){if(!useSet(x)||!grpOk(x.e,st.grp))continue;n++;if(x.rpe!=null){rn++;rs+=x.rpe;if(x.rpe>=9.5)hi++;if(x.rpe>=10)ten++}}}
    $('#k').innerHTML=`<div class="kpi"><div class="v">${nf(n)}</div><div class="l">Series en el periodo</div></div><div class="kpi"><div class="v">${n?dec(rn/n*100,0):'—'} %</div><div class="l">Con RPE registrado</div></div><div class="kpi"><div class="v">${rn?dec(rs/rn,2):'—'}</div><div class="l">RPE medio</div></div><div class="kpi"><div class="v">${rn?dec(hi/rn*100,0):'—'} %</div><div class="l">Series con RPE ≥ 9,5</div><div class="d">${rn?dec(ten/rn*100,0):'—'} % a RPE 10</div></div>`;
    $('#dn').textContent=st.dist==='rpe'?'Solo se cuentan las series con RPE anotado.':'Intensidad = peso de la serie ÷ tu mejor e1RM de ese ejercicio hasta la fecha final del periodo (≤6 reps en básicos, sin límite en el resto). En ejercicios de muchas repeticiones el e1RM está inflado, así que los porcentajes salen bajos.';
    const dr=dropRows(st.grp,+st.min);
    hbar($('#cd'),dr.slice().sort((a,b)=>a.drop-b.drop).map(r=>({name:r.n,value:r.drop,color:r.drop<-25?'var(--neg)':r.drop<-10?'var(--c3)':'var(--pos)',extra:`<div>${r.ses} sesiones · reps ${dec(r.r1)} → ${dec(r.r2)}</div>`})),{fmt:v=>sg(v,0)+' %',tick:v=>sg(v,0)+'%',aria:'Caída de repeticiones'});
    sortable($('#td'),[{key:'n',label:'Ejercicio'},{key:'g',label:'Grupo'},{key:'ses',label:'Sesiones (≥2 series)',num:1},{key:'r1',label:'Reps S1',num:1,f:v=>dec(v)},{key:'r2',label:'Reps S2',num:1,f:v=>dec(v)},{key:'drop',label:'Caída S1→S2',num:1,f:v=>sg(v)+' %',cls:v=>v<-25?'neg':''},{key:'ses3',label:'Sesiones (≥3 series)',num:1},{key:'drop3',label:'Caída S1→S3',num:1,f:v=>v==null?'—':sg(v)+' %',cls:v=>v!=null&&v<-25?'neg':''}],dr,st.td,draw,true);
    const fm=new Map();
    for(const s of SES){if(!inR(s.t))continue;for(const x of s.sets){if(x.ty===1||!grpOk(x.e,st.grp))continue;let o=fm.get(x.e);if(!o){o={n:EXN[x.e].n,g:EXN[x.e].g,nor:0,fa:0,dr:0};fm.set(x.e,o)}if(x.ty===2)o.fa++;else if(x.ty===3)o.dr++;else o.nor++}}
    const rows=[...fm.values()].filter(o=>o.fa+o.dr>0).map(o=>({...o,tot:o.nor+o.fa+o.dr,pf:(o.fa+o.dr)/(o.nor+o.fa+o.dr)*100}));
    sortable($('#tf'),[{key:'n',label:'Ejercicio'},{key:'g',label:'Grupo'},{key:'nor',label:'Normales',num:1},{key:'fa',label:'Al fallo',num:1},{key:'dr',label:'Dropsets',num:1},{key:'pf',label:'% fallo + drop',num:1,f:v=>dec(v,0)+' %'}],rows,st.tf,draw);
    if(!rows.length)$('#tf').innerHTML='<div class="empty">No hay series al fallo ni dropsets en este periodo.</div>';
  };
  ['dist','grp','gran','min'].forEach(k=>$('#'+k).onchange=e=>{st[k]=e.target.value;draw()});
  $('#norm').onchange=e=>{st.norm=e.target.checked;draw()};
  redraw=draw;draw();
}

/* ============ HÁBITOS Y CALENDARIO ============ */
function tabHab(){
  const st=S.hab;
  $('#view').innerHTML=`<div class="panel"><h2>¿Cuándo entrenas?</h2>
   <div class="ctl"><label>Medir<select id="hm"><option value="ses">Sesiones</option><option value="sets">Series</option><option value="vol">Volumen (kg·rep)</option></select></label></div>
   <div id="hmap" class="chart"></div><p class="note">Hora de inicio de la sesión. El filtro de día no se aplica en este panel ni en el de descansos.</p></div>
  <div class="panel"><h2>Descansos y rachas</h2><div class="kpis" id="rk"></div><div id="rh" class="chart"></div>
   <p class="note" id="rn"></p></div>
  <div class="panel"><h2>Duración, volumen y densidad por sesión</h2>
   <div class="ctl"><label>Agrupar por<select id="gran"><option value="week">Semana</option><option value="month">Mes</option></select></label>
   <label>Densidad<select id="den"><option value="vol">kg·rep por minuto</option><option value="sets">Series por minuto</option></select></label></div>
   <div class="two"><div><h2 style="font-size:17px">Duración media (min)</h2><div id="c1" class="chart"></div></div>
   <div><h2 style="font-size:17px">Volumen medio por sesión</h2><div id="c2" class="chart"></div></div></div>
   <h2 style="font-size:17px;margin-top:12px">Densidad de entrenamiento</h2><div id="c3" class="chart"></div>
   <p class="note">La app no guarda el tiempo de cada serie, así que la densidad se calcula con la duración total de la sesión (incluye descansos y calentamientos). Se ignoran las sesiones sin duración fiable.</p></div>`;
  $('#hm').value=st.hm;$('#gran').value=st.gran;$('#den').value=st.den;
  const draw=()=>{
    const ss=SES.filter(s=>inR(s.t));
    // mapa de calor
    const hrs=[];const h0=Math.min(...SES.map(s=>new Date(s.t).getUTCHours())),h1=Math.max(...SES.map(s=>new Date(s.t).getUTCHours()));for(let h=h0;h<=h1;h++)hrs.push(h);
    const grid=DOW.map(()=>hrs.map(()=>0));
    ss.forEach(s=>{const i=(new Date(s.t).getUTCDay()+6)%7,j=new Date(s.t).getUTCHours()-h0,x=sessionStats(s);grid[i][j]+=st.hm==='ses'?1:st.hm==='sets'?x.sets:x.vol});
    const fm=st.hm==='ses'?{long:v=>v+(v===1?' sesión':' sesiones'),short:v=>v}:st.hm==='sets'?{long:v=>nf(v)+' series',short:v=>nf(v)}:{long:v=>nf(v)+' kg·rep',short:v=>(v/1000).toFixed(0)+'k'};
    heat($('#hmap'),grid,hrs,fm);
    // descansos y rachas
    const days=[...new Set(ss.map(s=>dayStart(s.t)))].sort((a,b)=>a-b);
    if(days.length>1){
      const gaps=[];for(let i=1;i<days.length;i++)gaps.push({g:(days[i]-days[i-1])/DAY-1,a:days[i-1],b:days[i]});
      const gs=gaps.map(x=>x.g).sort((a,b)=>a-b),mean=gs.reduce((a,b)=>a+b,0)/gs.length,med=gs[Math.floor(gs.length/2)];
      const big=gaps.reduce((a,b)=>b.g>a.g?b:a);
      let run=1,best=1;for(let i=1;i<days.length;i++){run=days[i]-days[i-1]===DAY?run+1:1;if(run>best)best=run}
      const wk=new Set(ss.map(s=>bucket(s.t,'week').key));let w=bucket(G.from,'week').t,nw=0,emp=0,wr=0,wb=0;
      for(;w<=G.to;w+=7*DAY){nw++;if(wk.has(w)){wr++;if(wr>wb)wb=wr}else{emp++;wr=0}}
      $('#rk').innerHTML=`<div class="kpi"><div class="v">${days.length}</div><div class="l">Días de entrenamiento</div></div>
       <div class="kpi"><div class="v">${dec(mean,1)}</div><div class="l">Días de descanso entre sesiones (media)</div><div class="d">mediana ${med}</div></div>
       <div class="kpi"><div class="v">${big.g} días</div><div class="l">Mayor parón</div><div class="d">${fmtD(big.a)} → ${fmtD(big.b,1)}</div></div>
       <div class="kpi"><div class="v">${best}</div><div class="l">Días seguidos (racha máx.)</div></div>
       <div class="kpi"><div class="v">${wb}</div><div class="l">Semanas seguidas entrenando (máx.)</div></div>
       <div class="kpi"><div class="v">${emp}/${nw}</div><div class="l">Semanas sin ninguna sesión</div></div>`;
      const lab=['0 (días seguidos)','1 día','2 días','3 días','4 días','5 días','6 días','7 o más'],cnt=lab.map(()=>0);gaps.forEach(x=>cnt[Math.min(7,x.g)]++);
      hbar($('#rh'),lab.map((l,i)=>({name:l,value:cnt[i],color:'var(--c2)',extra:`<div>${dec(cnt[i]/gaps.length*100,0)} % de los descansos</div>`})),{fmt:v=>v,tick:v=>dec(v,0),aria:'Días de descanso entre sesiones'});
      $('#rn').textContent='Descanso = días completos sin entrenar entre dos días de entrenamiento consecutivos.';
    }else{$('#rk').innerHTML='';$('#rh').innerHTML='<div class="empty">Se necesitan al menos dos días de entrenamiento en el periodo.</div>';$('#rn').textContent=''}
    // duración, volumen, densidad
    const bk=new Map();
    for(const s of SES){if(!inS(s))continue;const b=bucket(s.t,st.gran),x=sessionStats(s);let a=bk.get(b.key);if(!a){a={b,n:0,vol:0,dur:0,dn:0,dvol:0,dsets:0};bk.set(b.key,a)}
      a.n++;a.vol+=x.vol;if(x.dur>0&&x.dur<400){a.dur+=x.dur;a.dn++;a.dvol+=x.vol;a.dsets+=x.sets}}
    const rows=[...bk.values()].sort((p,q)=>p.b.t-q.b.t);
    const mk=f=>rows.map(a=>({x:(a.b.t+a.b.t2)/2,x1:a.b.t,x2:a.b.t2,v:f(a),label:blabel(a.b,st.gran),extra:`<div>${a.n} sesiones</div>`})).filter(p=>p.v!=null&&isFinite(p.v));
    const o=(id,c,pts,fmt,tick)=>tchart($(id),{...baseOpts(),kind:'bar',h:260,series:[{name:'',color:c,pts}],fmt,tick,aria:id});
    o('#c1','var(--c1)',mk(a=>a.dn?a.dur/a.dn:null),v=>dec(v,0)+' min',v=>dec(v,0));
    o('#c2','var(--c2)',mk(a=>a.n?a.vol/a.n:null),v=>nf(v)+' kg·rep',v=>M.vol.t(v));
    o('#c3','var(--c3)',mk(a=>a.dur?(st.den==='vol'?a.dvol:a.dsets)/a.dur:null),st.den==='vol'?v=>dec(v,1)+' kg·rep/min':v=>dec(v,2)+' series/min',v=>dec(v,st.den==='vol'?0:1));
  };
  ['hm','gran','den'].forEach(k=>$('#'+k).onchange=e=>{st[k]=e.target.value;draw()});
  redraw=draw;draw();
}

/* ============ COMPARAR PERIODOS ============ */
function cmpRanges(st){
  const end=G.to+DAY;
  if(st.mode==='half'){const mid=dayStart((G.from+end)/2);return[[G.from,mid],[mid,end]]}
  if(st.mode==='custom')return[[fromISO(st.a0),fromISO(st.a1)+DAY],[fromISO(st.b0),fromISO(st.b1)+DAY]];
  const n=parseInt(st.mode)*7*DAY;return[[end-2*n,end-n],[end-n,end]];
}
function pStats(a,b){
  const R={ses:0,sets:0,vol:0,rs:0,rn:0,dur:0,dn:0,ex:new Map(),gr:new Map()};
  for(const s of SES){
    if(s.t<a||s.t>=b||!dowOk(s.t))continue;R.ses++;
    const d=(s.end-s.t)/6e4;if(d>0&&d<400){R.dur+=d;R.dn++}
    for(const x of s.sets){
      if(!useSet(x))continue;const w=x.w!=null?x.w*x.r:0;
      R.sets++;R.vol+=w;if(x.rpe!=null){R.rs+=x.rpe;R.rn++}
      let o=R.ex.get(x.e);if(!o){o={sets:0,vol:0,rs:0,rn:0,e1:null};R.ex.set(x.e,o)}
      o.sets++;o.vol+=w;if(x.rpe!=null){o.rs+=x.rpe;o.rn++}
      if(x.w!=null&&x.r>0&&x.r<=capFor(x.e,'auto')){const e1=x.w*(1+x.r/30);if(o.e1==null||e1>o.e1)o.e1=e1}
      const g=EXN[x.e].g;let q=R.gr.get(g);if(!q){q={sets:0,vol:0};R.gr.set(g,q)}q.sets++;q.vol+=w;
    }
  }
  return R;
}
function tabCmp(){
  const st=S.cmp;
  if(!st.a0){st.b1=toISO(DMAX);st.b0=toISO(DMAX-27*DAY);st.a1=toISO(DMAX-28*DAY);st.a0=toISO(DMAX-55*DAY)}
  $('#view').innerHTML=`<div class="panel"><h2>Comparar dos periodos</h2>
   <div class="ctl"><label>Comparación<select id="mode"><option value="4w">Últimas 4 semanas vs. las 4 anteriores</option><option value="8w">Últimas 8 semanas vs. las 8 anteriores</option><option value="12w">Últimas 12 semanas vs. las 12 anteriores</option><option value="half">Primera mitad vs. segunda mitad del periodo</option><option value="custom">Personalizado</option></select></label>
   <span id="cu" style="display:none;gap:8px;flex-wrap:wrap" class="ctl"><label>A desde<input type="date" id="a0"></label><label>A hasta<input type="date" id="a1"></label><label>B desde<input type="date" id="b0"></label><label>B hasta<input type="date" id="b1"></label></span></div>
   <p class="hint" id="lab"></p><div id="kt"></div>
   <p class="note">Los modos «Últimas N semanas» terminan en la fecha «Hasta» del filtro global. Las variaciones no son «buenas» ni «malas» por sí mismas: más volumen o RPE más alto pueden ser progreso o fatiga.</p></div>
  <div class="panel"><h2>Por ejercicio</h2>
   <div class="ctl"><label>Ver<select id="view2"><option value="de">Cambio de e1RM (%)</option><option value="dv">Cambio de volumen (%)</option><option value="ds">Cambio de series</option></select></label>
   <label>Grupo<select id="grp">${grpOpts()}</select></label><label>Mín. series (A+B)<select id="min"><option>0</option><option>3</option><option>6</option><option>12</option></select></label><label>Buscar<input type="search" id="q" placeholder="Ejercicio…"></label></div>
   <div id="ch" class="chart"></div><div id="tb" style="margin-top:10px"></div></div>
  <div class="panel"><h2>Por grupo muscular</h2><div id="tg"></div></div>`;
  ['mode','view2','grp','min'].forEach(k=>$('#'+k).value=st[k]);
  ['a0','a1','b0','b1'].forEach(k=>$('#'+k).value=st[k]);$('#q').value=st.q;
  const draw=()=>{
    $('#cu').style.display=st.mode==='custom'?'flex':'none';
    const [[a0,a1],[b0,b1]]=cmpRanges(st),A=pStats(a0,a1),B=pStats(b0,b1);
    const wa=(a1-a0)/(7*DAY),wb=(b1-b0)/(7*DAY);
    $('#lab').innerHTML=`<b>A</b>: ${fmtD(a0,1)} – ${fmtD(a1-DAY,1)} (${dec(wa,1)} sem.) · <b>B</b>: ${fmtD(b0,1)} – ${fmtD(b1-DAY,1)} (${dec(wb,1)} sem.)`;
    const R=[['Sesiones',A.ses,B.ses,v=>dec(v,0)],['Sesiones por semana',A.ses/wa,B.ses/wb,v=>dec(v,1)],['Series',A.sets,B.sets,nf],['Series por semana',A.sets/wa,B.sets/wb,v=>dec(v,0)],['Volumen (kg·rep)',A.vol,B.vol,nf],['Volumen por semana',A.vol/wa,B.vol/wb,nf],['RPE medio',A.rn?A.rs/A.rn:null,B.rn?B.rs/B.rn:null,v=>dec(v,2)],['Duración media (min)',A.dn?A.dur/A.dn:null,B.dn?B.dur/B.dn:null,v=>dec(v,0)]];
    $('#kt').innerHTML=`<div class="tw"><table><thead><tr><th>Métrica</th><th class="n">A</th><th class="n">B</th><th class="n">Cambio</th></tr></thead><tbody>${R.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]==null?'—':r[3](r[1])}</td><td class="n">${r[2]==null?'—':r[3](r[2])}</td><td class="n">${r[1]&&r[2]!=null?sg(pct(r[2],r[1]))+' %':'—'}</td></tr>`).join('')}</tbody></table></div>`;
    const q=st.q.toLowerCase(),keys=new Set([...A.ex.keys(),...B.ex.keys()]),rows=[];
    keys.forEach(e=>{const x=A.ex.get(e)||{sets:0,vol:0,rs:0,rn:0,e1:null},y=B.ex.get(e)||{sets:0,vol:0,rs:0,rn:0,e1:null},ex=EXN[e];
      if(!grpOk(e,st.grp)||x.sets+y.sets<+st.min||(q&&!ex.n.toLowerCase().includes(q)))return;
      rows.push({n:ex.n,g:ex.g,sa:x.sets,sb:y.sets,va:x.vol,vb:y.vol,ea:x.e1,eb:y.e1,de:pct(y.e1,x.e1),dv:x.vol&&y.vol?pct(y.vol,x.vol):null,ds:y.sets-x.sets,ra:x.rn?x.rs/x.rn:null,rb:y.rn?y.rs/y.rn:null})});
    const key=st.view2;
    const items=rows.filter(r=>r[key]!=null).sort((p,q2)=>q2[key]-p[key]).map(r=>({name:r.n,value:r[key],color:r[key]>0?'var(--pos)':r[key]<0?'var(--neg)':'var(--neu)',extra:`<div>Series: ${r.sa} → ${r.sb}</div>`+(r.ea!=null&&r.eb!=null?`<div>e1RM: ${dec(r.ea)} → ${dec(r.eb)} kg</div>`:'')}));
    hbar($('#ch'),items,{fmt:key==='ds'?v=>sg(v,0):v=>sg(v)+' %',tick:key==='ds'?v=>sg(v,0):v=>sg(v,0)+'%',aria:'Comparación por ejercicio'});
    sortable($('#tb'),[{key:'n',label:'Ejercicio'},{key:'g',label:'Grupo'},{key:'sa',label:'Series A',num:1},{key:'sb',label:'Series B',num:1},{key:'va',label:'Vol. A',num:1,f:nf},{key:'vb',label:'Vol. B',num:1,f:nf},{key:'dv',label:'Δ vol.',num:1,f:v=>v==null?'—':sg(v)+' %',cls:v=>cls(v)},{key:'ea',label:'e1RM A',num:1,f:v=>dec(v)},{key:'eb',label:'e1RM B',num:1,f:v=>dec(v)},{key:'de',label:'Δ e1RM',num:1,f:v=>v==null?'—':sg(v)+' %',cls:v=>cls(v)},{key:'ra',label:'RPE A',num:1,f:v=>dec(v,2)},{key:'rb',label:'RPE B',num:1,f:v=>dec(v,2)}],rows,st.tbl,draw,true);
    const gr=GROUPS.map(g=>{const x=A.gr.get(g)||{sets:0,vol:0},y=B.gr.get(g)||{sets:0,vol:0};return{g,sa:x.sets,sb:y.sets,ds:pct(y.sets,x.sets),va:x.vol,vb:y.vol,dv:pct(y.vol,x.vol)}}).filter(r=>r.sa+r.sb>0);
    sortable($('#tg'),[{key:'g',label:'Grupo'},{key:'sa',label:'Series A',num:1},{key:'sb',label:'Series B',num:1},{key:'ds',label:'Δ series',num:1,f:v=>v==null?'—':sg(v)+' %',cls:v=>cls(v)},{key:'va',label:'Vol. A',num:1,f:nf},{key:'vb',label:'Vol. B',num:1,f:nf},{key:'dv',label:'Δ vol.',num:1,f:v=>v==null?'—':sg(v)+' %',cls:v=>cls(v)}],gr,st.tg,draw);
  };
  ['mode','view2','grp','min'].forEach(k=>$('#'+k).onchange=e=>{st[k]=e.target.value;draw()});
  ['a0','a1','b0','b1'].forEach(k=>$('#'+k).onchange=e=>{if(e.target.value){st[k]=e.target.value;draw()}});
  $('#q').oninput=e=>{st.q=e.target.value;draw()};
  redraw=draw;draw();
}

/* ============ NAVEGACIÓN ============ */
const VIEWS={res:tabRes,str:tabStr,rec:tabRec,bw:tabBW,vol:tabVol,ex:tabEx,int:tabInt,cmp:tabCmp,hab:tabHab,ses:tabSes};
function go(t){S.tab=t;$('#nav').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===t}">${l}</button>`).join('');VIEWS[t]()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>redraw(),120)});
$('#sub').textContent=SES.length+' sesiones · '+D.sets.length+' filas de series · '+EXN.length+' ejercicios · '+BW.length+' mediciones de peso · '+fmtD(SES[0].t,1)+' – '+fmtD(DMAX,1);
initGlobal();go('res');
</script>
